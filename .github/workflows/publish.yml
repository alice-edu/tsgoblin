name: publish

# Publishes to npm on a GitHub Release (or manual dispatch), authenticating with the
# NPM_TOKEN repo secret. Use an npm *Automation* access token (it bypasses 2FA, which
# CI can't satisfy interactively). `--provenance` records a signed link from the npm
# package back to this repo + commit. The parity gate runs first, so a release that
# doesn't match vue-tsc never ships.
#
# To release: bump "version" in package.json, then create a GitHub Release (tag vX.Y.Z),
# or run this workflow manually (workflow_dispatch).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for --provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm install --no-audit --no-fund
      - run: npm test # selftest + parity vs vue-tsc — never publish a broken/drifted build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
