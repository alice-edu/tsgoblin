name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # tsgo is a preview compiler that ships frequent dev builds — a weekly run catches
  # when a new tsgo (or @vue/language-core) release breaks codegen/parity.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
      - run: npm install --no-audit --no-fund
      - run: npm run selftest
